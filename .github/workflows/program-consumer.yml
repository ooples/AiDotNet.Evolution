name: Standalone program consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Compiler and program contracts
        run: dotnet test tests/AiDotNet.Evolution.CSharp.Tests -c Release
      - name: Fresh consumer study and adversarial verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force TestResults | Out-Null
          dotnet run --project benchmarks/EvolutionNoise -c Release -- --output TestResults/consumer-noise.json
          if ($LASTEXITCODE -ne 0) { throw 'Consumer study failed.' }
          ./benchmarks/EvolutionNoise/Verify-Study.ps1 -Report TestResults/consumer-noise.json
          ./benchmarks/EvolutionNoise/Verify-Study.Tests.ps1 -Report TestResults/consumer-noise.json
          ./benchmarks/EvolutionNoise/Verify-Output.Tests.ps1 -Report TestResults/consumer-noise.json -Assembly benchmarks/EvolutionNoise/bin/Release/net10.0/EvolutionNoise.dll
