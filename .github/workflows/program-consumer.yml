name: Standalone program consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Compiler and program contracts
        run: dotnet test tests/AiDotNet.Evolution.CSharp.Tests -c Release
      - name: Standalone deployment and model search contracts
        run: dotnet test tests/AiDotNet.Evolution.Deployment.Tests -c Release
      - name: Standalone model-driven comparison host contracts
        shell: pwsh
        run: |
          dotnet build benchmarks/ProgramEvolutionComparison -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Program comparison host build failed.' }
          python benchmarks/ProgramEvolutionComparison/test_host.py
          if ($LASTEXITCODE -ne 0) { throw 'Program comparison host verification failed.' }
      - name: Pack optional deployment package
        shell: pwsh
        run: ./eng/Test-DeploymentPackage.ps1
      - name: Fresh consumer study and adversarial verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force TestResults | Out-Null
          dotnet run --project benchmarks/EvolutionNoise -c Release -- --output TestResults/consumer-noise.json
          if ($LASTEXITCODE -ne 0) { throw 'Consumer study failed.' }
          ./benchmarks/EvolutionNoise/Verify-Study.ps1 -Report TestResults/consumer-noise.json
          ./benchmarks/EvolutionNoise/Verify-Study.Tests.ps1 -Report TestResults/consumer-noise.json
          ./benchmarks/EvolutionNoise/Verify-Output.Tests.ps1 -Report TestResults/consumer-noise.json -Assembly benchmarks/EvolutionNoise/bin/Release/net10.0/EvolutionNoise.dll
