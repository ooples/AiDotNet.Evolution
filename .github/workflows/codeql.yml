name: CodeQL

on:
  # The merge queue tests each PR combined with everything ahead of it; required checks must report there too.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/competitive-evolution-platform, 'feat/evolution-us-*', feat/evolution-us02-efficacy, feat/evolution-us05-campaign-budget, feat/evolution-us07-ablation-integration, feat/evolution-us08-portfolio-integration]
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  # Cancel a superseded run on a branch, never on main: every push to main shares one ref, so
  # cancel-in-progress there means each merge kills the previous merge's run. A story's
  # "hosted CI green on the merged head" box then cannot be ticked, and main-red-alert has
  # nothing to read, which is how 21 stories came to be closed with that box open (#108).
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml
      - run: dotnet build src/AiDotNet.Evolution/AiDotNet.Evolution.csproj --configuration Release --framework net10.0
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:csharp
