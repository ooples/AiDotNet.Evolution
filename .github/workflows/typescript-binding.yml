name: TypeScript binding

on:
  push:
    branches: [main]
    paths:
      - 'bindings/typescript/**'
      - 'bindings/python/**'
      - 'bindings/c/**'
      - 'conformance/**'
      - 'benchmarks/worker-overhead/**'
      - 'src/AiDotNet.Evolution.Native/**'
      - 'src/AiDotNet.Evolution.Host/**'
      - 'src/AiDotNet.Evolution/**'
      - '.github/workflows/typescript-binding.yml'
      - 'eng/Test-RegistryConsumers.ps1'
      - 'eng/fixtures/RegistryConsumers/**'
  pull_request:
    paths:
      - 'bindings/typescript/**'
      - 'bindings/python/**'
      - 'bindings/c/**'
      - 'conformance/**'
      - 'benchmarks/worker-overhead/**'
      - 'src/AiDotNet.Evolution.Native/**'
      - 'src/AiDotNet.Evolution.Host/**'
      - 'src/AiDotNet.Evolution/**'
      - '.github/workflows/typescript-binding.yml'
      - 'eng/Test-RegistryConsumers.ps1'
      - 'eng/fixtures/RegistryConsumers/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run on a branch, never on main: every push to main shares one ref, so
  # cancel-in-progress there means each merge kills the previous merge's run. A story's
  # "hosted CI green on the merged head" box then cannot be ticked, and main-red-alert has
  # nothing to read, which is how 21 stories came to be closed with that box open (#108).
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  host:
    # ONE JOB PER PLATFORM, NOT A CROSS-COMPILE MATRIX. NativeAOT does not cross-compile:
    # it invokes the platform linker, so each runtime identifier has to be built on a
    # runner of that platform. That is also why the binding's own tests run here rather
    # than in a separate job -- this is the only place a binary for this platform exists.
    name: ${{ matrix.rid }} (node ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            node: '22'
          - rid: linux-x64
            runner: ubuntu-latest
            node: '22'
          - rid: osx-arm64
            runner: macos-14
            node: '22'
          # THE DECLARED MINIMUM, TESTED. package.json says node >= 18.17.0, and a
          # matrix that only ever ran 22 would let a syntax or API regression reach
          # every supported user while CI stayed green. One platform is enough for
          # this: the binding is plain JavaScript, and what differs between Node
          # versions is the runtime, not the operating system.
          - rid: linux-x64
            runner: ubuntu-latest
            node: '18.17.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      # The AOT compiler links with the platform toolchain, which is present on the
      # Windows and macOS images but needs the objcopy/ld pieces installed on Ubuntu.
      - name: Install the Linux AOT prerequisites
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Install the binding's dependencies
        working-directory: bindings/typescript
        run: npm install

      - name: Publish the NativeAOT host
        working-directory: bindings/typescript
        run: npm run host

      - name: Build the binding
        working-directory: bindings/typescript
        run: npm run build

      # Runs against the REAL binary published above. Without it the engine tests skip
      # themselves, so the count is asserted: a silent skip here would turn this whole
      # job into a build check that proves nothing about behaviour.
      - name: Test the binding
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          node scripts/check-test-output.mjs test-output.txt

      - name: Test Python durable binding against the real native host
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:AIDOTNET_DURABLE_HOST_PATH = Join-Path $PWD "bindings/typescript/bin/${{ matrix.rid }}/aidotnet-evolution-host$suffix"
          python -W error::ResourceWarning -m unittest discover -s bindings/python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The package users install, not the source tree: build the wheel, install it into a clean venv and run the same
      # suite (including the shared conformance scenarios) with the source path disabled. test_conformance refuses to
      # import from the source tree in this mode, so a shadowed import cannot pass as a packaging check.
      - name: Test the built Python wheel from a clean venv
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $work = Join-Path $env:RUNNER_TEMP 'python-wheel'
          python -m pip wheel --no-deps -w (Join-Path $work 'dist') bindings/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv (Join-Path $work 'venv')
          $python = if ($IsWindows) { Join-Path $work 'venv/Scripts/python.exe' } else { Join-Path $work 'venv/bin/python' }
          & $python -m pip install (Get-ChildItem (Join-Path $work 'dist/*.whl')).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AIDOTNET_PYTHON_INSTALLED = '1'
          $env:AIDOTNET_DURABLE_HOST_PATH = Join-Path $PWD "bindings/typescript/bin/${{ matrix.rid }}/aidotnet-evolution-host$suffix"
          & $python -W error::ResourceWarning -m unittest discover -s bindings/python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # V1-25 (#119): worker overhead per evaluation, both reference workers against this platform's native host. The
      # report separates the IPC round trip from the host's durable claim/commit writes; it is evidence, not a gate
      # (the < 2 ms target is not met while every claim and commit rewrites and fsyncs the whole durable state).
      - name: Measure reference-worker overhead per evaluation
        if: matrix.node == '22'
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $hostPath = Join-Path $PWD "bindings/typescript/bin/${{ matrix.rid }}/aidotnet-evolution-host$suffix"
          $out = 'TestResults/worker-overhead'
          python benchmarks/worker-overhead/measure_python.py --host $hostPath --output "$out/${{ matrix.rid }}-python.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node benchmarks/worker-overhead/measure_typescript.mjs --host $hostPath --output "$out/${{ matrix.rid }}-typescript.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '22'
        with:
          name: worker-overhead-${{ matrix.rid }}
          path: TestResults/worker-overhead
          if-no-files-found: error
          retention-days: 30

      - name: Publish and test the durable C ABI
        if: matrix.node == '22'
        shell: pwsh
        run: |
          dotnet publish src/AiDotNet.Evolution.Native -c Release -r '${{ matrix.rid }}' -o TestResults/native-library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.dll' } elseif ($IsMacOS) { '.dylib' } else { '.so' }
          python -W error::ResourceWarning bindings/c/test_native.py "TestResults/native-library/aidotnet-evolution-native$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ONLY THE PRIMARY NODE VERSION PUBLISHES. Two jobs now build linux-x64, and
      # uploading from both would collide on the artifact name -- the extra job exists
      # to test the declared Node minimum, not to produce a second copy of the same
      # binary.
      - name: Package the platform binary
        if: matrix.node == '22'
        working-directory: bindings/typescript
        run: npm run package -- ${{ matrix.rid }}

      # E-5: the packages exactly as the release publishes them, packed and installed into fresh npm and Python
      # consumers on this platform (the release runs the same script before publishing and again from the registries).
      - name: Install the packed npm and Python packages as fresh consumers
        if: matrix.node == '22'
        shell: pwsh
        run: |
          $version = (Get-Content bindings/typescript/package.json -Raw | ConvertFrom-Json).version
          $out = Join-Path $env:RUNNER_TEMP 'registry-packages'
          New-Item -ItemType Directory -Force (Join-Path $out 'npm'), (Join-Path $out 'python') | Out-Null
          Push-Location bindings/typescript
          npm pack "./packages/${{ matrix.rid }}" --pack-destination (Join-Path $out 'npm')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --pack-destination (Join-Path $out 'npm')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          python -m pip wheel --no-deps -w (Join-Path $out 'python') bindings/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./eng/Test-RegistryConsumers.ps1 -Version $version -NpmDirectory (Join-Path $out 'npm') -PythonDirectory (Join-Path $out 'python')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '22'
        with:
          name: evolution-host-${{ matrix.rid }}
          path: bindings/typescript/packages/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7
