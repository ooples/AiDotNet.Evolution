name: TypeScript binding

on:
  push:
    branches: [main]
    paths:
      - 'bindings/typescript/**'
      - 'bindings/python/**'
      - 'bindings/c/**'
      - 'conformance/**'
      - 'src/AiDotNet.Evolution.Native/**'
      - 'src/AiDotNet.Evolution.Host/**'
      - 'src/AiDotNet.Evolution/**'
      - '.github/workflows/typescript-binding.yml'
  pull_request:
    branches: [main, feat/competitive-evolution-platform]
    paths:
      - 'bindings/typescript/**'
      - 'bindings/python/**'
      - 'bindings/c/**'
      - 'conformance/**'
      - 'src/AiDotNet.Evolution.Native/**'
      - 'src/AiDotNet.Evolution.Host/**'
      - 'src/AiDotNet.Evolution/**'
      - '.github/workflows/typescript-binding.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  host:
    # ONE JOB PER PLATFORM, NOT A CROSS-COMPILE MATRIX. NativeAOT does not cross-compile:
    # it invokes the platform linker, so each runtime identifier has to be built on a
    # runner of that platform. That is also why the binding's own tests run here rather
    # than in a separate job -- this is the only place a binary for this platform exists.
    name: ${{ matrix.rid }} (node ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            node: '22'
          - rid: linux-x64
            runner: ubuntu-latest
            node: '22'
          - rid: osx-arm64
            runner: macos-14
            node: '22'
          # THE DECLARED MINIMUM, TESTED. package.json says node >= 18.17.0, and a
          # matrix that only ever ran 22 would let a syntax or API regression reach
          # every supported user while CI stayed green. One platform is enough for
          # this: the binding is plain JavaScript, and what differs between Node
          # versions is the runtime, not the operating system.
          - rid: linux-x64
            runner: ubuntu-latest
            node: '18.17.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      # The AOT compiler links with the platform toolchain, which is present on the
      # Windows and macOS images but needs the objcopy/ld pieces installed on Ubuntu.
      - name: Install the Linux AOT prerequisites
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Install the binding's dependencies
        working-directory: bindings/typescript
        run: npm install

      - name: Publish the NativeAOT host
        working-directory: bindings/typescript
        run: npm run host

      - name: Build the binding
        working-directory: bindings/typescript
        run: npm run build

      # Runs against the REAL binary published above. Without it the engine tests skip
      # themselves, so the count is asserted: a silent skip here would turn this whole
      # job into a build check that proves nothing about behaviour.
      - name: Test the binding
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          node scripts/check-test-output.mjs test-output.txt

      - name: Test Python durable binding against the real native host
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:AIDOTNET_DURABLE_HOST_PATH = Join-Path $PWD "bindings/typescript/bin/${{ matrix.rid }}/aidotnet-evolution-host$suffix"
          python -W error::ResourceWarning -m unittest discover -s bindings/python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The package users install, not the source tree: build the wheel, install it into a clean venv and run the same
      # suite (including the shared conformance scenarios) with the source path disabled. test_conformance refuses to
      # import from the source tree in this mode, so a shadowed import cannot pass as a packaging check.
      - name: Test the built Python wheel from a clean venv
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $work = Join-Path $env:RUNNER_TEMP 'python-wheel'
          python -m pip wheel --no-deps -w (Join-Path $work 'dist') bindings/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv (Join-Path $work 'venv')
          $python = if ($IsWindows) { Join-Path $work 'venv/Scripts/python.exe' } else { Join-Path $work 'venv/bin/python' }
          & $python -m pip install (Get-ChildItem (Join-Path $work 'dist/*.whl')).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AIDOTNET_PYTHON_INSTALLED = '1'
          $env:AIDOTNET_DURABLE_HOST_PATH = Join-Path $PWD "bindings/typescript/bin/${{ matrix.rid }}/aidotnet-evolution-host$suffix"
          & $python -W error::ResourceWarning -m unittest discover -s bindings/python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish and test the durable C ABI
        if: matrix.node == '22'
        shell: pwsh
        run: |
          dotnet publish src/AiDotNet.Evolution.Native -c Release -r '${{ matrix.rid }}' -o TestResults/native-library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.dll' } elseif ($IsMacOS) { '.dylib' } else { '.so' }
          python -W error::ResourceWarning bindings/c/test_native.py "TestResults/native-library/aidotnet-evolution-native$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ONLY THE PRIMARY NODE VERSION PUBLISHES. Two jobs now build linux-x64, and
      # uploading from both would collide on the artifact name -- the extra job exists
      # to test the declared Node minimum, not to produce a second copy of the same
      # binary.
      - name: Package the platform binary
        if: matrix.node == '22'
        working-directory: bindings/typescript
        run: npm run package -- ${{ matrix.rid }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '22'
        with:
          name: evolution-host-${{ matrix.rid }}
          path: bindings/typescript/packages/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7
