name: Automated Release Pipeline

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.0-preview.2)
        required: true
        type: string

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate release tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - run: dotnet restore AiDotNet.Evolution.slnx
      - name: Verify release workflow security contract
        shell: pwsh
        run: ./eng/Test-ReleaseWorkflow.ps1 -NoRestore
      - run: dotnet build src/AiDotNet.Evolution/AiDotNet.Evolution.csproj --configuration Release --no-restore
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net10.0 --no-restore --verbosity normal
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net8.0 --no-restore --verbosity normal
      - name: Test companion packages
        shell: pwsh
        run: |
          foreach ($project in @('AiDotNet.Evolution.CSharp.Tests', 'AiDotNet.Evolution.Deployment.Tests', 'AiDotNet.Evolution.Ptx.Tests')) {
            foreach ($framework in @('net8.0', 'net10.0')) {
              dotnet test "tests/$project/$project.csproj" -c Release -f $framework --no-restore --verbosity minimal
              if ($LASTEXITCODE -ne 0) { throw "Failed: $project $framework" }
            }
          }
      # Last in this job, so the nested tooling checkout cannot leak into the test steps above.
      - name: Check out the release gate from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Enforce the declared release claim (US-12)
        # A tag without release/claim.json makes no claim; 1.x needs the decisive v1-gate claim (#122).
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 .release-tooling/benchmarks/analysis/release_gate.py --release release --repository . --version "$RELEASE_VERSION" --output release-evidence.json
      - name: Retain the release assessment and its complete bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence.json
            release/**
          if-no-files-found: warn
          retention-days: 90

  legacy:
    name: Validate release on .NET Framework (net471, net462)
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - run: dotnet restore AiDotNet.Evolution.slnx
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net471 --no-restore --verbosity normal
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net462 --no-restore --verbosity normal

  pack:
    name: Pack and sign
    permissions:
      contents: read
    needs: [validate, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Check out packaging tooling from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - name: Build and pack all release packages in lockstep
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./.release-tooling/eng/Pack-Release.ps1 -Version $env:RELEASE_VERSION -OutputDirectory out -SourceDirectory .
      - name: Validate package contents and dependency boundary
        shell: pwsh
        run: ./.release-tooling/eng/Test-Package.ps1 -PackagePath "out/AiDotNet.Evolution.${{ needs.validate.outputs.version }}.nupkg" -ExpectedVersion "${{ needs.validate.outputs.version }}" -RepositoryRoot . -RequireReleaseTag
      - name: Verify release package consumers
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./.release-tooling/eng/Test-ReleaseConsumers.ps1 -Version $env:RELEASE_VERSION -PackageDirectory out
      # One CycloneDX SBOM per package (E-5), from the restored release tree, checked against what each package ships.
      - name: Generate package SBOMs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          dotnet tool restore --tool-manifest ./.release-tooling/.config/dotnet-tools.json
          if ($LASTEXITCODE -ne 0) { throw 'Tool restore failed.' }
          ./.release-tooling/eng/New-ReleaseSbom.ps1 -Version $env:RELEASE_VERSION -PackageDirectory out -SourceDirectory .
      - name: Sign NuGet packages when certificate is configured
        shell: pwsh
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_BASE64) -and
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_PASSWORD)) {
            Write-Host 'Signing certificate is not configured; packages remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_PASSWORD)) {
            throw 'Both code-signing secrets must be configured together.'
          }
          $certificate = Join-Path ([System.IO.Path]::GetTempPath()) 'aidotnet-evolution-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64))
          try {
            Get-ChildItem -LiteralPath out -Filter '*.nupkg' | ForEach-Object {
              dotnet nuget sign $_.FullName --certificate-path $certificate --certificate-password $env:CODE_SIGNING_CERT_PASSWORD --timestamper http://timestamp.digicert.com
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
              dotnet nuget verify $_.FullName --all
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($_.Name)." }
            }
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: |
            out/*.nupkg
            out/*.snupkg
            out/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest package provenance
    # Keep attestation OIDC in a differently named reusable workflow. NuGet matches
    # job_workflow_ref, so this token cannot satisfy the automated-release.yml policy.
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: pack
    uses: ./.github/workflows/attest-release.yml
    with:
      artifact-name: nuget-packages-${{ github.sha }}

  publish:
    name: Publish to NuGet
    # This is the only runner job whose OIDC identity matches the NuGet policy.
    permissions:
      contents: read
      id-token: write
    needs: [validate, pack, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: out
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - name: Authenticate to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ooples
      - name: Push packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet trusted publishing did not issue a temporary API key."
            exit 1
          fi
          shopt -s nullglob
          packages=(out/*.nupkg out/*.snupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No NuGet packages were downloaded."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  attach:
    name: Attach packages to GitHub release
    permissions:
      contents: write
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: evidence
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The release report and the complete declared bundle are published beside the packages (US-12).
          (cd evidence && zip -qr ../release-evidence-bundle.zip .)
          gh release upload "$RELEASE_TAG" out/*.nupkg out/*.snupkg out/*.cdx.json evidence/release-evidence.json release-evidence-bundle.zip --clobber --repo "$REPOSITORY"

  # npm and PyPI (E-5). Opt-in with the repository variable PUBLISH_REGISTRIES=true, set once the npm trusted publisher
  # and the PyPI trusted publisher name this workflow (.github/REPOSITORY_SETUP.md); until then every job below skips.
  # Everything is built and tested in jobs that hold no OIDC token. The two publish jobs never check out the repository
  # or run its code: they upload the files these jobs produced, because any job of this workflow that holds an OIDC token
  # could also exchange it for a NuGet key.
  registry-host:
    name: Build npm host (${{ matrix.rid }})
    if: vars.PUBLISH_REGISTRIES == 'true'
    permissions:
      contents: read
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the Linux AOT prerequisites
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Build and pack the platform host
        working-directory: bindings/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run host
          npm run package -- '${{ matrix.rid }}'
          mkdir -p "$GITHUB_WORKSPACE/out"
          # "./" keeps npm from reading packages/<rid> as a GitHub owner/repository shorthand.
          npm pack './packages/${{ matrix.rid }}' --pack-destination "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-host-${{ matrix.rid }}-${{ github.sha }}
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 30

  registry-pack:
    name: Pack and test npm and PyPI packages
    permissions:
      contents: read
    needs: [validate, registry-host]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: registry-host-*-${{ github.sha }}
          path: out/npm
          merge-multiple: true
      - name: Check every registry version is the release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const manifest = require("./bindings/typescript/package.json");
            const want = process.env.RELEASE_VERSION;
            const found = [manifest.version, ...Object.values(manifest.optionalDependencies)];
            if (found.some((version) => version !== want)) {
              console.error("::error::bindings/typescript/package.json has " + found.join(", ") + ", the release is " + want);
              process.exit(1);
            }'
          python - <<'EOF'
          import os, tomllib
          found = tomllib.load(open("bindings/python/pyproject.toml", "rb"))["project"]["version"]
          if found != os.environ["RELEASE_VERSION"]:
              raise SystemExit("::error::bindings/python/pyproject.toml has " + found + ", the release is " + os.environ["RELEASE_VERSION"])
          EOF
      - name: Pack the npm package and the Python distributions
        shell: bash
        run: |
          set -euo pipefail
          (cd bindings/typescript && npm install --no-audit --no-fund && npm pack --pack-destination "$GITHUB_WORKSPACE/out/npm")
          python -m pip install build==1.2.2.post1
          python -m build --outdir out/python bindings/python
          ls -l out/npm out/python
      - name: Install and run them as fresh consumers
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./eng/Test-RegistryConsumers.ps1 -Version $env:RELEASE_VERSION -NpmDirectory out/npm -PythonDirectory out/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-packages-${{ github.sha }}
          path: |
            out/npm/*.tgz
            out/python/*
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: Publish to npm
    # npm trusted publishing: npm (11.5.1 or later) exchanges the OIDC token itself, and the provenance statement names
    # this workflow. Hosts first, so the main package never points at a host version that does not exist yet.
    # npm matches the CALLING workflow's filename, so a release from release-please.yml needs a trusted publisher
    # for release-please.yml as well as one for this file (manual reruns); see .github/REPOSITORY_SETUP.md.
    permissions:
      contents: read
      id-token: write
    needs: [validate, publish, registry-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is part of the OIDC token, so the npm trusted publisher can require it, and a required reviewer
    # on it makes each npm upload wait for approval, as the pypi environment does for PyPI.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aidotnet/evolution
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-packages-${{ github.sha }}
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the packed tarballs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("::error::npm " + process.argv[1] + " cannot use trusted publishing (needs 11.5.1)");
              process.exit(1);
            }' "$(npm --version)"
          for name in evolution-host-win-x64 evolution-host-linux-x64 evolution-host-osx-arm64 evolution; do
            if npm view "@aidotnet/$name@$RELEASE_VERSION" version >/dev/null 2>&1; then
              echo "@aidotnet/$name@$RELEASE_VERSION is already published; skipping."
              continue
            fi
            npm publish "out/npm/aidotnet-$name-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
          done

  publish-pypi:
    name: Publish to PyPI
    permissions:
      contents: read
      id-token: write
    needs: [validate, publish, registry-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aidotnet-evolution-worker
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-packages-${{ github.sha }}
          path: out
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/python
          skip-existing: true

  verify-registries:
    name: Fresh consumers from npm and PyPI (${{ matrix.os }})
    permissions:
      contents: read
    needs: [validate, publish-npm, publish-pypi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the published packages into fresh consumers
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./eng/Test-RegistryConsumers.ps1 -Version $env:RELEASE_VERSION -FromRegistry