name: Automated Release Pipeline

on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.0-preview.2)
        required: true
        type: string

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate release tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - run: dotnet restore AiDotNet.Evolution.slnx
      - run: dotnet build src/AiDotNet.Evolution/AiDotNet.Evolution.csproj --configuration Release --no-restore
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net10.0 --no-restore --verbosity normal
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net8.0 --no-restore --verbosity normal

  legacy:
    name: Validate release on net471
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - run: dotnet restore AiDotNet.Evolution.slnx
      - run: dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj --configuration Release --framework net471 --no-restore --verbosity normal

  pack:
    name: Pack, sign, and attest
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [validate, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - run: dotnet restore src/AiDotNet.Evolution/AiDotNet.Evolution.csproj
      - name: Build every package target on this runner
        run: dotnet build src/AiDotNet.Evolution/AiDotNet.Evolution.csproj --configuration Release --no-restore
      - name: Pack exact tag version
        run: >
          dotnet pack src/AiDotNet.Evolution/AiDotNet.Evolution.csproj
          --configuration Release --no-build --no-restore --output out
          -p:PackageVersion=${{ needs.validate.outputs.version }}
      - name: Validate package contents and dependency boundary
        shell: pwsh
        run: ./eng/Test-Package.ps1 -PackagePath "out/AiDotNet.Evolution.${{ needs.validate.outputs.version }}.nupkg" -ExpectedVersion "${{ needs.validate.outputs.version }}"
      - name: Sign NuGet packages when certificate is configured
        shell: pwsh
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_BASE64) -and
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_PASSWORD)) {
            Write-Host 'Signing certificate is not configured; packages remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERT_PASSWORD)) {
            throw 'Both code-signing secrets must be configured together.'
          }
          $certificate = Join-Path ([System.IO.Path]::GetTempPath()) 'aidotnet-evolution-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64))
          try {
            Get-ChildItem -LiteralPath out -Filter '*.nupkg' | ForEach-Object {
              dotnet nuget sign $_.FullName --certificate-path $certificate --certificate-password $env:CODE_SIGNING_CERT_PASSWORD --timestamper http://timestamp.digicert.com
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
              dotnet nuget verify $_.FullName --all
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($_.Name)." }
            }
          }
          finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Attest package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            out/*.nupkg
            out/*.snupkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: |
            out/*.nupkg
            out/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    permissions:
      contents: read
    needs: [validate, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: out
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - name: Push packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not configured."
            exit 1
          fi
          shopt -s nullglob
          packages=(out/*.nupkg out/*.snupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No NuGet packages were downloaded."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  attach:
    name: Attach packages to GitHub release
    permissions:
      contents: write
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: out
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/*.nupkg out/*.snupkg --clobber --repo "${{ github.repository }}"
