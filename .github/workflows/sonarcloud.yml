name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/competitive-evolution-platform]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarCloud Analysis
    if: "${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      # A Dependabot-triggered run reads secrets from the repository's DEPENDABOT secret
      # store, not the Actions store, so SONAR_TOKEN is empty when it is not configured there
      # and the analysis below threw. 'SonarCloud Analysis' is a REQUIRED check, so that
      # throw blocked every Dependabot PR permanently for a configuration reason rather
      # than anything wrong with the change. Skip only the analysis on those runs; restore,
      # build and test still execute below, so dependency PRs keep real validation.
      #
      # A missing token on any OTHER run is still a hard failure: that is genuine
      # misconfiguration and must not silently downgrade to "no analysis".
      - name: Determine whether SonarCloud analysis can run
        id: sonar_guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUN_ACTOR: ${{ github.actor }}
        shell: pwsh
        run: |
          $hasToken = -not [string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)
          $isDependabot = $env:RUN_ACTOR -eq 'dependabot[bot]'
          if ($hasToken) {
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          elseif ($isDependabot) {
            Write-Host '::notice::SONAR_TOKEN is not exposed to Dependabot runs (Dependabot reads its own secret store), so SonarCloud analysis is skipped for this dependency PR. Build and tests still run. To restore analysis here, add SONAR_TOKEN under Settings > Secrets and variables > Dependabot.'
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            throw 'SONAR_TOKEN is not configured for AiDotNet.Evolution.'
          }
      - name: Install scanner
        if: steps.sonar_guard.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Begin analysis
        if: steps.sonar_guard.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        shell: pwsh
        run: |
          $arguments = @(
            '/k:ooples_AiDotNet.Evolution',
            '/o:ooples',
            "/d:sonar.token=$env:SONAR_TOKEN",
            '/d:sonar.host.url=https://sonarcloud.io',
            '/d:sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml',
            '/d:sonar.coverage.exclusions=tests/**'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            $arguments += "/d:sonar.pullrequest.key=$env:PR_NUMBER"
            $arguments += "/d:sonar.pullrequest.branch=$env:PR_BRANCH"
            $arguments += "/d:sonar.pullrequest.base=$env:PR_BASE"
          }
          dotnet-sonarscanner begin @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet restore AiDotNet.Evolution.slnx
      - name: Build
        run: dotnet build AiDotNet.Evolution.slnx --configuration Release --framework net10.0 --no-restore
      - name: Test with OpenCover
        run: >
          dotnet test tests/AiDotNet.Evolution.Tests/AiDotNet.Evolution.Tests.csproj
          --configuration Release --framework net10.0 --no-build
          --collect:"XPlat Code Coverage" --results-directory coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End analysis
        if: steps.sonar_guard.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
