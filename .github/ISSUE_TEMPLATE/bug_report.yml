name: Bug report
description: Report an incorrect, nondeterministic, or incompatible behavior
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact exception, outcome, or invariant violation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the genome/task setup, seed, target framework, and options.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Target framework
      options:
        - net10.0
        - net8.0
        - net471
    validations:
      required: true
