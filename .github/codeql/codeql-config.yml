name: AiDotNet.Evolution CodeQL configuration

queries:
  - uses: security-and-quality

# These advisory queries conflict with deliberate semantics in this library: exact equality identifies IEEE-754
# endpoints and unchanged descriptor definitions; LINQ rewrites would allocate in hot archive/engine loops; and the
# remeasurement block is intentionally kept together as one transactional staging operation. Security and correctness
# queries, including path/dataflow checks and generic exception handling, remain enabled.
query-filters:
  - exclude:
      id: cs/equality-on-floats
  - exclude:
      id: cs/linq/missed-select
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/complex-block
