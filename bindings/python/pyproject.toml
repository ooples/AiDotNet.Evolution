[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidotnet-evolution-worker"
version = "0.1.0"
description = "Trusted local IPC client for AiDotNet.Evolution durable workers"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["."]
include = ["aidotnet_evolution*"]
